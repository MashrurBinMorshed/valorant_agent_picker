# Valorant Instalocker Configuration
# Adjust these settings as needed

[HOTKEY]
# Activation hotkey - common options:
# "ctrl+shift+n", "alt+n", "f6", "shift+f", "ctrl+q"
activation_key = ctrl+shift+n

[DETECTION]
# Confidence threshold for detection (0.0 - 1.0)
# Higher = more strict (fewer false positives)
# Lower = more lenient (better detection)
confidence_threshold = 0.75

# Detection methods to use (priority order)
# Options: ocr, template, color
detection_methods = ocr,template,color

[MOUSE]
# Mouse speed in seconds (lower = faster, higher = slower)
# Fast: 0.01 - 0.05
# Medium: 0.05 - 0.1
# Slow: 0.1 - 0.2
mouse_speed = 0.05

# Offset from detected position when clicking
# Adjust if mouse doesn't click on Neon correctly
click_offset_x = 0
click_offset_y = 50

[TESSERACT]
# Path to Tesseract OCR executable
# Default Windows location
tesseract_path = C:\Program Files\Tesseract-OCR\tesseract.exe

# Optional: try alternative path if above fails
tesseract_alt_path = C:\Program Files (x86)\Tesseract-OCR\tesseract.exe

[AGENT]
# Agent to pick (default: NEON)
# Can change to: REYNA, SAGE, JETT, VIPER, KILLJOY, etc.
target_agent = NEON

[TIMING]
# Maximum time to search for agent (seconds)
max_search_time = 15

# Time to wait before automatic pickup (for animation delays)
pre_click_delay = 0.05

[DEBUG]
# Enable debug output
debug_mode = false

# Show FPS/performance stats
show_stats = false
